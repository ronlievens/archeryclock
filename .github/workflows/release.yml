name: Build and publish releases

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: archeryclock-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }} (${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            architecture: x64
            jdk-architecture: x64
            java-distribution: temurin
            maven-profile: release-linux-x64
          - os: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            jdk-architecture: aarch64
            java-distribution: temurin
            maven-profile: release-linux-arm64
          - os: windows-latest
            platform: windows
            architecture: x64
            jdk-architecture: x64
            java-distribution: temurin
            maven-profile: release-windows-x64
          - os: windows-11-arm
            platform: windows
            architecture: arm64
            jdk-architecture: aarch64
            java-distribution: zulu
            maven-profile: release-windows-arm64
          - os: macos-latest
            platform: macos
            architecture: arm64
            jdk-architecture: aarch64
            java-distribution: temurin
            maven-profile: release-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ matrix.java-distribution }}
          java-version: '27'
          architecture: ${{ matrix.jdk-architecture }}
          cache: maven

      - name: Install Linux packaging tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install WiX Toolset for Windows ARM64
        if: matrix.platform == 'windows' && matrix.architecture == 'arm64'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1.20250415 --yes --no-progress
          $wixBin = Join-Path ${env:ProgramFiles(x86)} 'WiX Toolset v3.14\bin'
          if (-not (Test-Path $wixBin)) { throw "WiX Toolset was not installed at $wixBin" }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Set Maven version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.19.1:set \
            "-DnewVersion=${version}" \
            -DgenerateBackupPoms=false

      - name: Read Maven artifact coordinates
        shell: bash
        run: |
          echo "ARTIFACT_ID=$(mvn --batch-mode -q help:evaluate -Dexpression=project.artifactId -DforceStdout)" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$(mvn --batch-mode -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_ENV"

      - name: Build native packages
        run: mvn --batch-mode clean package "-Prelease,${{ matrix.maven-profile }}"

      - name: Prepare Flatpak input
        if: matrix.platform == 'linux'
        run: |
          mkdir -p packaging/flatpak/input
          cp -a target/dist/app-image/ArcheryClock/. packaging/flatpak/input/

      - name: Build Flatpak bundle
        if: matrix.platform == 'linux'
        run: |
          flatpak-builder --force-clean --user --install-deps-from=flathub \
            --repo=target/flatpak/repo \
            target/flatpak/build \
            packaging/flatpak/com.github.ronlievens.archeryclock.yml
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            target/flatpak/repo \
            "target/${ARTIFACT_ID}-${PROJECT_VERSION}-linux-${{ matrix.architecture }}.flatpak" \
            com.github.ronlievens.archeryclock stable

      - name: Archive Linux app image
        if: matrix.platform == 'linux'
        run: tar -czf "target/${ARTIFACT_ID}-${PROJECT_VERSION}-${{ matrix.platform }}-${{ matrix.architecture }}-app-image.tar.gz" -C target/dist/app-image ArcheryClock

      - name: Archive Windows app image
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path target/dist/app-image/ArcheryClock -DestinationPath "target/$env:ARTIFACT_ID-$env:PROJECT_VERSION-${{ matrix.platform }}-${{ matrix.architecture }}-app-image.zip"

      - name: Archive macOS app image
        if: matrix.platform == 'macos'
        run: ditto -c -k --sequesterRsrc --keepParent target/dist/app-image/ArcheryClock.app "target/${ARTIFACT_ID}-${PROJECT_VERSION}-${{ matrix.platform }}-${{ matrix.architecture }}-app-image.zip"

      - name: Add architecture to installer filename (Linux/macOS)
        if: matrix.platform == 'linux' || matrix.platform == 'macos'
        env:
          ARTIFACT_ID: ${{ env.ARTIFACT_ID }}
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          for installer in target/dist/installer/*; do
            [ -f "$installer" ] || continue
            mv "$installer" "target/dist/installer/$ARTIFACT_ID-$PROJECT_VERSION-$PLATFORM-$ARCHITECTURE.${installer##*.}"
          done

      - name: Add architecture to installer filename (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          ARTIFACT_ID: ${{ env.ARTIFACT_ID }}
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          Get-ChildItem target/dist/installer -File | ForEach-Object {
            Rename-Item $_.FullName "$env:ARTIFACT_ID-$env:PROJECT_VERSION-$env:PLATFORM-$env:ARCHITECTURE$($_.Extension)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.ARTIFACT_ID }}-${{ env.PROJECT_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}
          path: |
            target/${{ env.ARTIFACT_ID }}-${{ env.PROJECT_VERSION }}-${{ matrix.platform }}-${{ matrix.architecture }}-app-image.*
            target/dist/installer/*
            target/${{ env.ARTIFACT_ID }}-${{ env.PROJECT_VERSION }}-linux-${{ matrix.architecture }}.flatpak
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Remove previous snapshot release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete snapshot-main --yes --cleanup-tag || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'snapshot-main' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('ArcheryClock {0}', github.ref_name) || format('ArcheryClock Snapshot (main) {0}', github.sha) }}
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
